name: Apply index.html patch

on:
  push:
    branches: ["claude/tmp-apply-index-patch"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: claude/pensive-bardeen-x4arug
          fetch-depth: 0

      - name: Extract patch from the temp branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin claude/tmp-apply-index-patch
          git show FETCH_HEAD:tools/index.patch > /tmp/index.patch
          echo "patch bytes: $(wc -c < /tmp/index.patch)"

      - name: Apply patch and verify blob SHA
        run: |
          set -euo pipefail
          git apply --verbose /tmp/index.patch
          sha="$(git hash-object bellepros-poutine-catch/index.html)"
          echo "resulting blob sha: $sha"
          test "$sha" = "39c09f555c0c098bef902cb90ef9efeb2e379b93"

      - name: Commit and push to target branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' 'fix(poutine-catch): keyboard dead zone, Space double-fire, and input capture' '' 'Also restores the Pages deploy trigger to main and carries the rotated' '(env-based) leaderboard function onto this branch, so merging cannot' 'reintroduce the old trigger or the retired secret.' > /tmp/msg
          git add bellepros-poutine-catch/index.html
          git commit -F /tmp/msg
          git push origin HEAD:claude/pensive-bardeen-x4arug
