name: Deploy games to GitHub Pages

on:
  push:
    branches: ["claude/bellepros-piri-rush-game-jcrsq"]
  workflow_dispatch:

# Allow the workflow to enable Pages and publish the site
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; let in-progress runs finish
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the whole repo so both games + the landing page are served
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
